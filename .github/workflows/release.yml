name: Release

# Releases are created manually from a committed, tested main — never
# automatically on push. Notes are derived from commits since the last tag.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without leading v (must match package.json)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: skill-audit/package-lock.json

      - name: Install dependencies
        working-directory: ./skill-audit
        run: npm ci

      - name: Verify version matches input
        working-directory: ./skill-audit
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          if [ "$CURRENT" != "${{ inputs.version }}" ]; then
            echo "::error::package.json version $CURRENT does not match requested ${{ inputs.version }}. Commit the version bump first."
            exit 1
          fi

      - name: Tests
        working-directory: ./skill-audit
        run: npm test

      - name: Verify packed tarball
        working-directory: ./skill-audit
        run: npm run verify:pack

      - name: Derive release notes from commits
        working-directory: ./skill-audit
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$LAST_TAG" ]; then
            git log --no-merges --pretty=format:"- %s (%h)" "$LAST_TAG..HEAD" > /tmp/notes.md
          else
            git log --no-merges --pretty=format:"- %s (%h)" > /tmp/notes.md
          fi
          {
            echo "## Changes"
            cat /tmp/notes.md
            echo ""
            echo "## Install"
            echo '```bash'
            echo "npm install -g @hungpg/skill-audit@${{ inputs.version }}"
            echo '```'
          } > release-notes.md

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ inputs.version }}
          name: Release v${{ inputs.version }}
          bodyFile: release-notes.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
