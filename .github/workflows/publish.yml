name: Publish to npm

# Publishing is manual and tag-anchored: only from a committed, tagged,
# tested artifact. Never triggered automatically.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Tagged version to publish, without leading v (for example: 0.9.4)'
        required: true

concurrency:
  group: npm-stable-publish
  cancel-in-progress: false

permissions: {}

jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Validate the requested version
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "$REQUESTED_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must be a stable SemVer value such as 0.10.1"
            exit 1
          fi
          printf 'version=%s\n' "$REQUESTED_VERSION" >> "$GITHUB_OUTPUT"

  publish:
    needs: validate
    if: needs.validate.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # Required for npm provenance
    environment: npm-publish

    env:
      ACTIONS_STEP_DEBUG: false
      ACTIONS_RUNNER_DEBUG: false
      NPM_CONFIG_LOGLEVEL: warn

    steps:
      - name: Checkout the tagged commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: v${{ needs.validate.outputs.version }}
          fetch-depth: 0

      - name: Verify tag matches package.json
        working-directory: ./skill-audit
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          if [ "$CURRENT" != "$RELEASE_VERSION" ]; then
            echo "::error::tag v$RELEASE_VERSION points at package.json version $CURRENT; refusing to publish a mismatched artifact"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
          cache-dependency-path: skill-audit/package-lock.json

      - name: Install dependencies
        working-directory: ./skill-audit
        run: npm ci

      - name: Tests
        working-directory: ./skill-audit
        run: npm test

      - name: Verify packed tarball (bytes)
        working-directory: ./skill-audit
        run: npm run verify:pack

      - name: Publish from the verified tag
        working-directory: ./skill-audit
        run: npm publish --access public
