name: Beta Release

# Beta releases publish an already reviewed beta-version commit from main.
# The workflow never mutates a branch: that keeps the publishing identity
# separate from source changes and lets branch protection govern the version bump.
on:
  workflow_dispatch:

concurrency:
  group: npm-beta-publish
  cancel-in-progress: false

permissions: {}

env:
  ACTIONS_STEP_DEBUG: false
  ACTIONS_RUNNER_DEBUG: false
  NPM_CONFIG_LOGLEVEL: warn

jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.commit.outputs.sha }}

    steps:
      - name: Checkout main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '24'

      - name: Validate the reviewed beta version
        id: version
        working-directory: ./skill-audit
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-beta\.[1-9][0-9]*$ ]]; then
            echo "::error::package.json must contain a beta version such as 0.10.2-beta.1"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::tag v$VERSION already exists"
            exit 1
          fi
          printf 'version=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"

      - name: Record the reviewed commit
        id: commit
        run: printf 'sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  publish:
    needs: validate
    if: needs.validate.result == 'success'
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout the reviewed beta commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: ${{ needs.validate.outputs.sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
          cache-dependency-path: skill-audit/package-lock.json

      - name: Install dependencies
        working-directory: ./skill-audit
        run: npm ci

      - name: Tests
        working-directory: ./skill-audit
        run: npm test

      - name: Verify packed tarball (bytes)
        working-directory: ./skill-audit
        run: npm run verify:pack

      - name: Publish the committed, verified beta
        working-directory: ./skill-audit
        run: npm publish --tag beta --access public

  release:
    needs: [validate, publish]
    if: needs.publish.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Create the GitHub prerelease for the published commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_SHA: ${{ needs.validate.outputs.sha }}
        run: |
          gh release create "v$RELEASE_VERSION" \
            --target "$RELEASE_SHA" \
            --title "Beta Release v$RELEASE_VERSION" \
            --prerelease \
            --notes "Pre-release for testing; not recommended for production."
