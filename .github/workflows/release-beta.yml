name: Beta Release

# Beta releases follow the same traceable policy as stable ones:
# commit the bump FIRST on the dispatched branch, verify the committed tree,
# publish, then tag the exact commit that carries the version. Nothing
# publishes uncommitted state and no tag points at a commit that lacks the
# published version.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Base version for the beta, without leading v (defaults to package.json)'
        required: false

permissions:
  contents: write
  id-token: write

env:
  ACTIONS_STEP_DEBUG: false
  ACTIONS_RUNNER_DEBUG: false
  NPM_CONFIG_LOGLEVEL: warn

jobs:
  beta-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (dispatched branch)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Determine beta version
        id: version
        working-directory: ./skill-audit
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          BASE="${{ inputs.version }}"
          if [ -z "$BASE" ]; then
            if [[ "$CURRENT" == *"-beta."* ]]; then
              BASE=$(echo "$CURRENT" | sed 's/-beta\..*//')
              NEXT=$(( $(echo "$CURRENT" | sed 's/.*-beta\.//') + 1 ))
            else
              BASE="$CURRENT"
              NEXT=1
            fi
          else
            # Count existing beta tags for the given base to pick the next number.
            NEXT=$(( $(git tag -l "v${BASE}-beta.*" | sed 's/.*-beta\.//' | sort -n | tail -1 || echo 0) + 1 ))
          fi
          NEW_VERSION="${BASE}-beta.${NEXT}"
          echo "Current: $CURRENT -> Beta: $NEW_VERSION"
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Commit the version bump FIRST (traceability)
        id: bump
        working-directory: ./skill-audit
        run: |
          npm version --no-git-tag-version "${{ steps.version.outputs.version }}" --silent
          npm install --package-lock-only --ignore-scripts --silent
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: bump to v${{ steps.version.outputs.version }} [skip release]"
          # Push back to the branch this workflow was dispatched from, so the
          # published version exists remotely before anything is published.
          # A rejected push fails the run BEFORE publishing (fail closed).
          git push origin "${GITHUB_REF_NAME}"
          echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Install dependencies
        working-directory: ./skill-audit
        run: npm ci

      - name: Tests
        working-directory: ./skill-audit
        run: npm test

      - name: Verify packed tarball (bytes)
        working-directory: ./skill-audit
        run: npm run verify:pack

      - name: Derive release notes from commits
        working-directory: ./skill-audit
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          RANGE="$LAST_TAG..HEAD"
          if [ -z "$LAST_TAG" ]; then RANGE="HEAD"; fi
          {
            echo "## Beta ${{ steps.version.outputs.version }}"
            echo ""
            git log --no-merges --pretty=format:"- %s (%h)" "$RANGE"
            echo ""
            echo ""
            echo "Pre-release for testing; not recommended for production."
            echo ""
            echo "### Install"
            echo '```bash'
            echo "npm install @hungpg/skill-audit@beta"
            echo '```'
          } > release-notes.md

      - name: Publish the committed, verified beta
        working-directory: ./skill-audit
        run: npm publish --tag beta --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Tag the exact published commit
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ steps.version.outputs.version }}
          commit: ${{ steps.bump.outputs.sha }}
          name: Beta Release v${{ steps.version.outputs.version }}
          bodyFile: skill-audit/release-notes.md
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
