name: Update Vulnerability DB

on:
  schedule:
    # Run daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-db:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: skill-audit/package-lock.json

      - name: Restore vulnerability feed cache
        uses: actions/cache@v4
        with:
          path: skill-audit/.cache/skill-audit
          key: vuln-db-feeds-${{ github.run_id }}
          restore-keys: |
            vuln-db-feeds-

      - name: Install dependencies
        working-directory: ./skill-audit
        run: npm ci

      - name: Build
        working-directory: ./skill-audit
        run: npm run build

      - name: Update vulnerability feeds
        working-directory: ./skill-audit
        run: npm run security:update
