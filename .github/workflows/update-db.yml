name: Update Vulnerability DB

on:
  schedule:
    # Run daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-db:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: skill-audit/package-lock.json

      - name: Restore vulnerability feed cache
        uses: actions/cache@v4
        with:
          path: skill-audit/.cache/skill-audit
          key: vuln-db-feeds-${{ github.run_id }}
          restore-keys: |
            vuln-db-feeds-

      - name: Install dependencies
        working-directory: ./skill-audit
        run: npm ci

      - name: Build
        working-directory: ./skill-audit
        run: npm run build

      - name: Update vulnerability feeds
        working-directory: ./skill-audit
        run: npm run security:update
